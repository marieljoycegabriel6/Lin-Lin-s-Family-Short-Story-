<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lin Lin’s Family · Flipbook</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 30%,#fbf1df 0%,#f1dfc4 100%);color:#493326;font-family:'Comic Sans MS','Trebuchet MS',sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex:0 0 auto}
.brand{font-size:clamp(17px,2.4vh,26px);font-weight:800;color:#8d3f4d}
.badge{font-size:clamp(11px,1.5vh,15px);color:#826854;letter-spacing:.1em}
.tools{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:30px;background:#426b58;color:#fff;padding:10px 20px;font:700 clamp(15px,2vh,21px) 'Trebuchet MS',sans-serif;cursor:pointer;min-height:46px;white-space:nowrap}
.btn:hover{background:#315540}.btn:disabled{opacity:.35;cursor:default}
.btn.small{padding:8px 14px;min-height:40px;font-size:clamp(13px,1.7vh,17px);background:#806852}
.btn.small:hover{background:#6a5543}
.btn.rose{background:#8d3f4d}.btn.rose:hover{background:#74303d}
.btn:focus-visible,.w:focus-visible,.corner:focus-visible{outline:4px solid #2465a1;outline-offset:3px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 16px}

/* ---------- book ---------- */
.board{position:relative;background:#8d3f4d;padding:1.1%;border-radius:1.6vh;box-shadow:0 18px 50px #5a2c1c44,inset 0 0 0 3px #a65261}
.book{position:relative;width:100%;height:100%;container-type:inline-size;border-radius:6px;background:#fffdf7;
  box-shadow:3px 0 0 #efe4d0,6px 0 0 #fffaf0,9px 1px 0 #e9dcc6,-3px 0 0 #efe4d0,-6px 0 0 #fffaf0,-9px 1px 0 #e9dcc6}
.sc{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;background:#fffdf7;border-radius:6px;overflow:hidden}
.pic{position:relative;flex:0 0 auto;aspect-ratio:16/9;width:100%;background:#fff7e9;overflow:hidden}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.band{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw 3cqw;text-align:center;
  background:linear-gradient(#fffdf7,#fbf3e3)}
.gutter{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0 45%,#0000000d 48.5%,#00000030 50%,#0000000d 51.5%,transparent 55% 100%)}
.sentence{margin:0;font-size:3.3cqw;line-height:1.38;font-weight:800}
.w{font:inherit;color:#ae3e51;background:#fff0e7;border:0;border-bottom:.3cqw dashed #ce6070;border-radius:1cqw;padding:0 .7cqw;cursor:pointer}
.w:hover{background:#ffe1d4}.w.on{background:#ffd5c6}
.zh{min-height:4.4cqw;margin-top:.6cqw;display:flex;align-items:center;justify-content:center}
.zh span{font-family:system-ui,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:2.4cqw;color:#8d3147;background:#fce8ec;border-radius:1cqw;padding:.3cqw 2cqw;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.pnum{position:absolute;bottom:.8cqw;font-size:1.2cqw;color:#a68b74}
.pnum.l{left:1.6cqw}.pnum.r{right:1.6cqw}

/* cover */
.cover .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#8d3f4d55)}
.cover .band{background:#8d3f4d;color:#fff7ec}
.cover-label{font-size:1.25cqw;letter-spacing:.2em;color:#f6d8c9}
.cover-title{font-size:5cqw;margin:.3cqw 0 .6cqw;line-height:1.1;text-shadow:0 .3cqw 0 #5f2430}
.cover .btn{font-size:1.8cqw;min-height:0;padding:.9cqw 3cqw;background:#fff7ec;color:#8d3f4d}
.cover .btn:hover{background:#ffe6d6}
.ribbon{position:absolute;top:2cqw;left:50%;transform:translateX(-50%);background:#fff7ecee;color:#8d3f4d;font-weight:800;font-size:1.4cqw;padding:.6cqw 2.4cqw;border-radius:5cqw;letter-spacing:.1em}

/* end page */
.endpics{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;padding:2cqw 3cqw;height:100%;align-items:center;background:#fff7e9}
.tile{background:#fff;border-radius:1.4cqw;padding:1cqw;box-shadow:0 .5cqw 1.5cqw #794d2922;text-align:center}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.8cqw;display:block}
.tile .num{display:inline-block;margin-top:1cqw;width:3.6cqw;height:3.6cqw;line-height:3.6cqw;border-radius:50%;background:#8d3f4d;color:#fff;font-size:2.2cqw;font-weight:800}
.tile .w{font-size:2.5cqw;display:block;margin:.8cqw auto 0;width:max-content;font-weight:800}
.end-title{font-size:4.6cqw;margin:0;color:#8d3f4d;line-height:1.1}
.end-sub{font-size:1.9cqw;margin:.4cqw 0 .9cqw}
.band .btn{font-size:1.7cqw;min-height:0;padding:.8cqw 2.6cqw}

/* flip animation layer */
.anim{position:absolute;inset:0;perspective:260cqw;pointer-events:none}
.anim[hidden]{display:none}
.half{position:absolute;top:0;width:50%;height:100%;overflow:hidden}
.half.L{left:0;border-radius:6px 0 0 6px}.half.R{left:50%;border-radius:0 6px 6px 0}
.half .sc{width:200%}
.half.R .sc,.face.front .sc{left:-100%}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face .sc{width:200%}
.face.front{border-radius:0 6px 6px 0}
.face.back{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.face.front .shade{background:linear-gradient(90deg,#00000040,#0000 40%,#ffffff22 90%)}
.face.back .shade{background:linear-gradient(270deg,#00000040,#0000 40%,#ffffff22 90%)}
.castR,.castL{position:absolute;top:0;width:50%;height:100%;pointer-events:none;opacity:0}
.castR{left:50%;background:linear-gradient(90deg,#00000055,#0000 60%)}
.castL{left:0;background:linear-gradient(270deg,#00000055,#0000 60%)}

/* page-curl corners */
.corner{position:absolute;bottom:0;width:7cqw;height:7cqw;border:0;padding:0;cursor:pointer;background:none;z-index:5}
.corner.next{right:0;border-radius:0 0 6px 0}
.corner.prev{left:0;border-radius:0 0 0 6px}
.corner::before{content:"";position:absolute;inset:0;transition:transform .2s;transform-origin:100% 100%}
.corner.next::before{background:linear-gradient(315deg,transparent 48%,#e8dcc6 50%,#fffaf0 62%,transparent 63%);transform-origin:100% 100%;transform:scale(.55)}
.corner.prev::before{background:linear-gradient(45deg,transparent 48%,#e8dcc6 50%,#fffaf0 62%,transparent 63%);transform-origin:0 100%;transform:scale(.55)}
.corner:hover::before{transform:scale(1)}
.corner[hidden]{display:none}

/* footer */
footer{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 20px 12px}
.hint{flex:1;margin:0;font-size:clamp(13px,1.8vh,19px);color:#836653;line-height:1.4}
.tip{flex-basis:100%;order:9;margin:0;padding:10px 16px;background:#fff7e3;border:2px dashed #d8b98a;border-radius:14px;font-size:clamp(14px,1.9vh,19px)}
.tip[hidden]{display:none}
footer{flex-wrap:wrap}
nav{display:flex;align-items:center;gap:12px}
.page{font-size:clamp(15px,2vh,22px);color:#836653;min-width:74px;text-align:center}
#status{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#493326;color:#fff;padding:8px 16px;border-radius:20px;font:15px system-ui;opacity:0;transition:opacity .3s;pointer-events:none}
#status.show{opacity:1}

/* quiz */
.quiz{border:0;padding:0;border-radius:24px;width:min(850px,94vw);max-height:90vh;background:#fffaf0;color:#493326;box-shadow:0 20px 80px #0004}
.quiz::backdrop{background:#2d261dc4}
.qi{padding:clamp(18px,3vw,35px)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:15px}
.qtop h2{margin:0;color:#8d3f4d;font-size:clamp(24px,3vw,36px)}
.qq{font-size:clamp(24px,3vw,38px);line-height:1.3;margin:22px 0 12px}
.qc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.opt{display:flex;flex-direction:column;gap:8px}
.choice{flex:1;font:700 clamp(20px,2.4vw,28px) 'Comic Sans MS','Trebuchet MS',sans-serif;min-height:76px;padding:14px;border:3px solid #dbc9ae;border-radius:16px;background:#fff;color:#493326;cursor:pointer}
.choice:hover{background:#fff0dc}.choice.correct{border-color:#39744f;background:#e3f5e5}.choice.retry{border-color:#c58c3d;background:#fff0ce}
.say{align-self:center;min-height:44px;border:2px solid #426b58;border-radius:28px;color:#315540;background:#edf6ee;font:700 16px 'Trebuchet MS',sans-serif;padding:6px 16px;cursor:pointer}
.qf{font-size:clamp(22px,2.3vw,29px);font-weight:700;min-height:40px;margin:16px 0}
.qb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qb span{font-size:18px}

@media(max-width:700px){header{padding:8px 10px}.badge{display:none}footer{padding:6px 10px 10px;gap:8px}.hint{flex-basis:100%;order:-1}.btn{padding:8px 14px;font-size:15px}.stage{padding:4px 8px}}
@media(prefers-reduced-motion:reduce){.zh span{animation:none}}

/* talking characters */
.actor{position:absolute;overflow:hidden;clip-path:ellipse(50% 50% at 50% 50%);pointer-events:none;transform-origin:50% 100%;will-change:transform}
.actor img{position:absolute;max-width:none;display:block}
.actor.top{transform-origin:50% 50%}
.sc.act .actor{animation-duration:var(--dur,1s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);filter:drop-shadow(0 .3cqw .4cqw #0003)}
.sc.act .actor[data-a="bounce"]{animation-name:bounce}
.sc.act .actor[data-a="sway"]{animation-name:sway}
.sc.act .actor[data-a="shake"]{animation-name:shake;--dur:.5s}
.sc.act .actor[data-a="float"]{animation-name:float;--dur:2s}
.sc.act .actor[data-a="breathe"]{animation-name:breathe;--dur:1.6s}
.sc.act .actor[data-a="cough"]{animation-name:cough;--dur:.9s}
.sc.act .actor[data-a="pulse"]{animation-name:pulse;--dur:1.2s}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.03)}35%{transform:translateY(-5%) scale(1.05,1.06)}55%{transform:translateY(0) scale(1.06,1.01)}}
@keyframes sway{0%,100%{transform:rotate(-3.5deg) scale(1.04)}50%{transform:rotate(3.5deg) scale(1.04)}}
@keyframes shake{0%,100%{transform:translateX(0) scale(1.04)}25%{transform:translateX(-1.6%) rotate(-1.5deg) scale(1.04)}75%{transform:translateX(1.6%) rotate(1.5deg) scale(1.04)}}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0) scale(1.03)}50%{transform:translate(-8%,-10%) rotate(-6deg) scale(1.1)}}
@keyframes breathe{0%,100%{transform:scale(1.02)}50%{transform:scale(1.09) translateY(-2%)}}
@keyframes cough{0%,100%{transform:scale(1.03)}10%{transform:translateY(2%) rotate(-3deg) scale(1.05)}20%{transform:translateY(-1%) rotate(2deg) scale(1.04)}30%{transform:translateY(2%) rotate(-3deg) scale(1.05)}45%{transform:scale(1.03)}}
@keyframes pulse{0%,100%{transform:scale(1.02)}50%{transform:scale(1.1)}}
.listening{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #426b5844}}
@media(prefers-reduced-motion:reduce){.sc.act .actor{animation-duration:3s!important}}

/* end-of-story quiz */
.fq{border:0;padding:0;border-radius:24px;width:min(900px,95vw);max-height:94vh;background:#fffaf0;color:#493326;box-shadow:0 20px 80px #0004}
.fq::backdrop{background:#2d261dc4}
.fqi{padding:clamp(16px,2.6vw,30px)}
.fqtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.part{font:800 clamp(15px,1.8vw,20px) 'Trebuchet MS',sans-serif;color:#fff;border-radius:20px;padding:6px 14px}
.p1{background:#426b58}.p2{background:#8d3f4d}.p3{background:#2e6aa1}.p4{background:#b8742a}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:#e3d5bf}.dots i.ok{background:#39744f}.dots i.miss{background:#d9a441}.dots i.now{outline:3px solid #493326;outline-offset:1px}
.fqq{font-size:clamp(22px,2.8vw,34px);line-height:1.25;margin:10px 0 6px;font-weight:800}
.fqzh{font-family:system-ui,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:clamp(18px,2.2vw,26px);color:#8d3147;background:#fce8ec;border-radius:12px;padding:4px 16px;display:inline-block;margin:0 0 8px}
.fqzh[hidden]{display:none}
.fqpic{display:block;max-height:22vh;max-width:100%;margin:8px auto;border-radius:14px;box-shadow:0 6px 16px #794d2922}
.fqemoji{font-size:clamp(70px,12vh,120px);text-align:center;margin:4px 0}
.fqrow{display:flex;gap:10px;flex-wrap:wrap}
.sortc{display:flex;flex-direction:column;align-items:center;gap:6px}
.sortc .n{width:clamp(44px,6vw,64px);height:clamp(44px,6vw,64px);line-height:clamp(44px,6vw,64px);border-radius:50%;background:#8d3f4d;color:#fff;font-size:clamp(26px,3.6vw,40px)}
.fqres{text-align:center}
.fqres h2{font-size:clamp(30px,4vw,48px);color:#8d3f4d;margin:10px 0}
.big{font-size:clamp(44px,7vw,80px);margin:0}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0;text-align:left}
.parts div{background:#fff;border-radius:14px;padding:12px 16px;font-size:clamp(16px,1.9vw,21px);box-shadow:0 3px 10px #794d2918}
.endq{margin-left:1cqw}

.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.crop{position:relative;display:block;height:clamp(80px,15vh,150px);max-width:100%;overflow:hidden;border-radius:12px;background:#fff7e9;box-shadow:0 2px 8px #794d2922}
.crop img{position:absolute;max-width:none}
.crop.wide{aspect-ratio:16/9}
.cemoji{font-size:clamp(54px,10vh,96px);line-height:1;height:clamp(80px,15vh,150px);display:flex;align-items:center}
.ct{line-height:1.2}
</style>
</head>
<body>
<header>
  <div class="brand">📖 Lin Lin’s Family</div>
  <div class="tools">
    <span class="badge">MY LITTLE FLIPBOOK</span>
    <button class="btn small" id="soundBtn" aria-pressed="true" aria-label="Page-turn sound on">🔈 Sound</button>
    <button class="btn small" id="fsBtn">⛶ Full screen</button>
  </div>
</header>

<div class="stage" id="stage">
  <div class="board" id="board">
    <div class="book" id="book">
      <div id="spread"></div>
      <div class="anim" id="anim" hidden></div>
      <button class="corner prev" id="cornerPrev" aria-label="Turn back a page"></button>
      <button class="corner next" id="cornerNext" aria-label="Turn the page"></button>
    </div>
  </div>
</div>

<footer>
  <p class="hint" id="hint"></p>
  <button class="btn small" id="tipBtn" hidden>🍎 Teacher tip</button>
  <button class="btn rose" id="qBtn" hidden>Question ?</button>
  <button class="btn" id="listenBtn">🔊 Listen</button>
  <nav aria-label="Pages">
    <button class="btn" id="prevBtn" aria-label="Previous page">←</button>
    <span class="page" id="pageNo">Cover</span>
    <button class="btn" id="nextBtn" aria-label="Next page">→</button>
  </nav>
  <p class="tip" id="tip" hidden></p>
</footer>
<div id="status" role="status"></div>

<dialog class="quiz" id="quiz" aria-labelledby="qTitle">
  <div class="qi">
    <div class="qtop"><h2 id="qTitle">Let’s think!</h2><button class="btn small" id="qClose">Close ×</button></div>
    <p class="qq" id="qText"></p>
    <button class="btn" id="qListen">🔊 Listen to question</button>
    <div class="qc" id="qChoices"></div>
    <p class="qf" id="qFeed" role="status" aria-live="polite"></p>
    <div class="qb"><span id="qCount"></span><button class="btn" id="qNext" hidden>Next question →</button></div>
  </div>
</dialog>


<dialog class="fq" id="fq" aria-labelledby="fqTitle">
  <div class="fqi" id="fqBody"></div>
</dialog>

      <button class="btn" data-go="1" style="margin-top:1cqw">Open the book →</button></div>`;
  }else if(k===LAST){
    sc.innerHTML=`<div class="pic"><div class="endpics">
      <div class="tile"><img src="${IMG[3]}" alt=""><span class="num">1</span>${W('一手菸','first-hand smoke')}</div>
      <div class="tile"><img src="${IMG[4]}" alt=""><span class="num">2</span>${W('二手菸','second-hand smoke')}</div>
      <div class="tile"><img src="${IMG[5]}" alt=""><span class="num">3</span>${W('三手菸','third-hand smoke')}</div></div></div>
      <div class="band"><h2 class="end-title">The End</h2><p class="end-sub">Can you say all three? Then try the Story Quiz!</p>
      <div><button class="btn" data-quiz="1">⭐ Story Quiz</button> <button class="btn rose endq" data-go="0">↺ Read it again</button></div><div class="zh"></div></div><div class="gutter"></div>`;
  }else{
    const s=story[k-1];
    sc.innerHTML=`<div class="pic"><img src="${IMG[s.img]}" alt="${s.alt}">${actorsHTML(k-1)}</div>
      <div class="band"><p class="sentence">${s.html()}</p><div class="zh" aria-live="polite"></div></div>
      <div class="gutter"></div><span class="pnum l">${k*2-1}</span><span class="pnum r">${k*2}</span>`;
  }
  if(live){
    sc.querySelectorAll('.w').forEach(b=>b.addEventListener('click',()=>{
      const zh=sc.querySelector('.zh'),on=b.classList.contains('on');
      sc.querySelectorAll('.w').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-expanded','false')});
      if(on){zh.innerHTML='';return}
      b.classList.add('on');b.setAttribute('aria-expanded','true');
      zh.innerHTML=`<span lang="zh-Hant">${b.dataset.zh}</span>`;
    }));
    sc.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>turnTo(+b.dataset.go)));
    sc.querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',openFinal));
  }else{
    sc.querySelectorAll('button').forEach(b=>b.tabIndex=-1);
    sc.setAttribute('aria-hidden','true');
  }
  return sc;
}

function show(k){
  const sp=document.getElementById('spread');sp.replaceChildren(build(k,true));
  const s=story[k-1];
  document.getElementById('pageNo').textContent=k===0?'Cover':k===LAST?'The End':k+' / '+story.length;
  document.getElementById('prevBtn').disabled=k===0;
  document.getElementById('nextBtn').disabled=k===LAST;
  document.getElementById('cornerPrev').hidden=k===0;
  document.getElementById('cornerNext').hidden=k===LAST;
  document.getElementById('qBtn').hidden=!s&&k!==LAST;document.getElementById('qBtn').textContent=k===LAST?'⭐ Story Quiz':'Question ?';
  document.getElementById('hint').innerHTML=(k>0&&k<LAST?'Tap the picture or 🔊 Listen to see them move. ':'')+(k===0?'Open the book to begin. Tap the highlighted words for Chinese. Tap 🔊 Listen or the picture to make the characters move!':k===LAST?'Tap each kind of smoke to see its Chinese name.':s.hint);
  const tipBtn=document.getElementById('tipBtn'),tip=document.getElementById('tip');
  tipBtn.hidden=!(s&&s.tip);tip.hidden=true;if(s&&s.tip)tip.innerHTML='<strong>Teacher cue:</strong> '+s.tip;
  document.getElementById('book').setAttribute('aria-label',k===0?'Book cover':k===LAST?'The end':'Page '+k);
}

function half(k,side,cls){const d=document.createElement('div');d.className=cls||('half '+side);d.append(build(k,false));return d}
function face(k,side){const f=document.createElement('div');f.className='face '+side;f.append(build(k,false));const sh=document.createElement('div');sh.className='shade';f.append(sh);return f}

function turnTo(t){
  if(turning||t<0||t>LAST||t===cur)return;
  stopSpeech();
  const fwd=t>cur,from=cur;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){cur=t;show(t);return}
  turning=true;flipSound();
  const anim=document.getElementById('anim');anim.replaceChildren();
  // underneath: left half & right half that will be revealed
  const L=half(fwd?from:t,'L'),R=half(fwd?t:from,'R');
  const leaf=document.createElement('div');leaf.className='leaf';
  const front=face(fwd?from:t,'front'),back=face(fwd?t:from,'back');
  leaf.append(front,back);
  const castR=document.createElement('div');castR.className='castR';
  const castL=document.createElement('div');castL.className='castL';
  anim.append(L,R,castR,castL,leaf);anim.hidden=false;
  document.getElementById('spread').style.visibility='hidden';
  const dur=950,ease='cubic-bezier(.45,.05,.35,1)';
  const a=fwd?[0,-180]:[-180,0];
  const lift=[{transform:`rotateY(${a[0]}deg)`},{transform:`rotateY(${(a[0]+a[1])/2}deg) translateZ(1px)`,offset:.5},{transform:`rotateY(${a[1]}deg)`}];
  const p=leaf.animate(lift,{duration:dur,easing:ease,fill:'forwards'});
  front.querySelector('.shade').animate(fwd?[{opacity:0},{opacity:1}]:[{opacity:1},{opacity:0}],{duration:dur/2,easing:ease,fill:'forwards',delay:fwd?0:dur/2});
  back.querySelector('.shade').animate(fwd?[{opacity:1},{opacity:0}]:[{opacity:0},{opacity:1}],{duration:dur/2,easing:ease,fill:'forwards',delay:fwd?dur/2:0});
  (fwd?castR:castL).animate([{opacity:.9},{opacity:0}],{duration:dur/2,easing:ease,fill:'forwards'});
  (fwd?castL:castR).animate([{opacity:0},{opacity:.9},{opacity:0}],{duration:dur,easing:ease,fill:'forwards'});
  p.onfinish=()=>{cur=t;show(t);document.getElementById('spread').style.visibility='';anim.hidden=true;anim.replaceChildren();turning=false};
}

/* ---- sizing: fit the book (16:13 spread) to the stage ---- */
const RATIO=16/13;
function fit(){
  const st=document.getElementById('stage'),b=document.getElementById('board');
  const w=st.clientWidth-32,h=st.clientHeight-8;
  let bw=Math.min(w,h*RATIO);b.style.width=bw+'px';b.style.height=(bw/RATIO)+'px';
}
addEventListener('resize',fit);

/* ---- sound ---- */
let ac=null;
function flipSound(){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const len=ac.sampleRate*.55,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++){const x=i/len;d[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*x),2)*(1-x*.6)}
    const src=ac.createBufferSource();src.buffer=buf;
    const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=.7;
    f.frequency.setValueAtTime(900,ac.currentTime);f.frequency.linearRampToValueAtTime(3200,ac.currentTime+.5);
    const g=ac.createGain();g.gain.value=.35;
    src.connect(f).connect(g).connect(ac.destination);src.start();
  }catch(e){}
}
document.getElementById('soundBtn').addEventListener('click',e=>{soundOn=!soundOn;const b=e.currentTarget;b.textContent=soundOn?'🔈 Sound':'🔇 Sound';b.setAttribute('aria-pressed',soundOn);b.setAttribute('aria-label','Page-turn sound '+(soundOn?'on':'off'))});

/* ---- speech ---- */
let actTimer=null;
function actors(on){
  const sc=document.querySelector('#spread .sc');if(sc)sc.classList.toggle('act',on);
  document.getElementById('listenBtn').classList.toggle('listening',on);
  clearTimeout(actTimer);
}
function stopSpeech(){actors(false);if('speechSynthesis'in window)speechSynthesis.cancel()}
function speak(text,animate){
  if(!('speechSynthesis'in window)){toast('Audio is not supported in this browser.');if(animate){actors(true);actTimer=setTimeout(()=>actors(false),4000)}return}
  speechSynthesis.cancel();actors(false);
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.75;
  const v=speechSynthesis.getVoices().find(v=>v.lang==='en-US');if(v)u.voice=v;
  if(animate){
    actors(true);
    const stop=()=>actors(false);u.onend=stop;u.onerror=stop;
    actTimer=setTimeout(stop,1500+text.length*110); // safety stop if a browser never fires "end"
  }
  speechSynthesis.speak(u);
}
document.getElementById('listenBtn').addEventListener('click',()=>speak(cur===0?'Lin Lin’s Family.':cur===LAST?'The end. First-hand smoke. Second-hand smoke. Third-hand smoke.':story[cur-1].say,true));
let tt;function toast(m){const s=document.getElementById('status');s.textContent=m;s.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>s.classList.remove('show'),2500)}

/* ---- controls ---- */
document.getElementById('spread').addEventListener('click',e=>{if(e.target.closest('.pic')&&cur>0&&cur<LAST)document.getElementById('listenBtn').click()});
document.getElementById('prevBtn').addEventListener('click',()=>turnTo(cur-1));
document.getElementById('nextBtn').addEventListener('click',()=>turnTo(cur+1));
document.getElementById('cornerPrev').addEventListener('click',()=>turnTo(cur-1));
document.getElementById('cornerNext').addEventListener('click',()=>turnTo(cur+1));
document.getElementById('tipBtn').addEventListener('click',()=>{const t=document.getElementById('tip');t.hidden=!t.hidden});
document.addEventListener('keydown',e=>{if(quiz.open||fq.open)return;if(e.key==='ArrowRight'||e.key==='PageDown')turnTo(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')turnTo(cur-1)});
let ts=null;const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ts={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});
bookEl.addEventListener('touchend',e=>{if(!ts)return;const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)turnTo(cur+(dx<0?1:-1));ts=null},{passive:true});
document.getElementById('fsBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast('Use your browser’s full-screen option instead.')}});
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'⛶ Exit full screen':'⛶ Full screen';setTimeout(fit,50)});

/* ---- quiz ---- */
const quiz=document.getElementById('quiz');let qi=0;
function renderQ(){
  stopSpeech();const set=story[cur-1].q,q=set[qi];
  document.getElementById('qTitle').textContent='Page '+cur+' · Let’s think!';
  document.getElementById('qText').textContent=q.t;
  document.getElementById('qCount').textContent='Question '+(qi+1)+' of '+set.length;
  document.getElementById('qFeed').textContent='Choose an answer.';
  document.getElementById('qNext').hidden=true;
  const box=document.getElementById('qChoices');box.replaceChildren();
  q.c.forEach((label,i)=>{
    const o=document.createElement('div');o.className='opt';
    const b=document.createElement('button');b.className='choice';b.textContent=label;
    b.addEventListener('click',()=>{box.querySelectorAll('.choice').forEach(x=>x.classList.remove('retry'));
      if(i===q.a){b.classList.add('correct');document.getElementById('qFeed').textContent='✓ Correct!';speak('Correct!');document.getElementById('qNext').hidden=qi>=set.length-1}
      else{b.classList.add('retry');document.getElementById('qFeed').textContent='Try again!';speak('Try again!')}});
    const s=document.createElement('button');s.className='say';s.textContent='🔊 Listen';s.setAttribute('aria-label','Listen to answer: '+label);s.addEventListener('click',()=>speak(label));
    o.append(b,s);box.append(o);
  });
}
document.getElementById('qBtn').addEventListener('click',()=>{if(cur===LAST){openFinal();return}if(cur<1||cur>story.length)return;qi=0;renderQ();quiz.showModal()});
document.getElementById('qClose').addEventListener('click',()=>quiz.close());
quiz.addEventListener('close',stopSpeech);
document.getElementById('qNext').addEventListener('click',()=>{qi++;renderQ()});
document.getElementById('qListen').addEventListener('click',()=>speak(story[cur-1].q[qi].t));


/* ---- end-of-story quiz: 4 parts ---- */
const PARTS=['Remember','Sort the smoke','Understand','Lin Lin’s choice'];
const SORT=['first-hand','second-hand','third-hand'];
const C=(img,x,y,w,h)=>({crop:[img,x,y,w,h]});
const GRANDPA=C(0,17,1,18,28),MOM=C(0,32,3,15,28),LINLIN=C(0,66,12,16,28),WORRIED=C(2,53,2,22,40),BABY=C(5,54,26,26,46),SMOKE=C(1,62,17,21,25);
const FQ=[
 {p:0,t:'Who smokes?',zh:'誰抽菸？',c:[{t:'Grandpa',...GRANDPA},{t:'Mom',...MOM},{t:'Lin Lin',...LINLIN}],a:0},
 {p:0,t:'Who breathes in second-hand smoke?',zh:'誰吸入了二手菸？',c:[{t:'Grandpa',...GRANDPA},{t:'Mom',...MOM},{t:'Lin Lin',...LINLIN}],a:1},
 {p:0,t:'Is Lin Lin happy or worried?',zh:'Lin Lin 開心還是擔心？',c:[{t:'Happy',...LINLIN},{t:'Worried',...WORRIED}],a:1},
 {p:1,sort:1,t:'Grandpa breathes in the smoke.',a:0},
 {p:1,sort:1,t:'Mom breathes in Grandpa’s smoke.',a:1},
 {p:1,sort:1,t:'Smoke is on the bunny.',a:2},
 {p:1,sort:1,t:'Smoke is on my shirt.',emoji:'👕',a:2},
 {p:2,t:'Why is Lin Lin worried?',zh:'Lin Lin 為什麼擔心？',c:[{t:'Grandpa is sick.',emoji:'🤒'},{t:'Smoke is bad for her family.',...SMOKE},{t:'She is hungry.',emoji:'🍔'}],a:1},
 {p:2,t:'The cigarette is gone. Is the smoke gone?',zh:'香菸熄了。菸也不見了嗎？',c:[{t:'Yes, it is.',emoji:'✅'},{t:'No, it isn’t.',...C(5,29,50,26,46)}],a:1},
 {p:2,t:'Can the baby touch third-hand smoke?',zh:'寶寶會碰到三手菸嗎？',c:[{t:'Yes, on toys and the carpet.',...BABY},{t:'No, it is gone.',emoji:'❌'}],a:0},
 {p:3,t:'What can Lin Lin say to Grandpa?',zh:'Lin Lin 可以對爺爺說什麼？',c:[{t:'Grandpa, please don’t smoke at home.',emoji:'🏠🚭'},{t:'Grandpa, please smoke more.',emoji:'🚬🚬🚬'},{t:'Grandpa, smoke next to the baby.',emoji:'👶🚬'}],a:0},
 {p:3,t:'Grandpa, please smoke ______.',say:'Grandpa, please smoke, blank.',zh:'爺爺，請你到______抽菸。',c:[{t:'outside',emoji:'🌳'},{t:'in the bedroom',emoji:'🛏️'},{t:'next to Mom',...MOM}],a:0},
 {p:3,t:'Is smoke good or bad for Mom and the baby?',zh:'菸對媽媽和寶寶是好的還是不好的？',c:[{t:'Good',emoji:'👍'},{t:'Bad',emoji:'👎'}],a:1}
];
const SORT_ZH='這是哪一種菸？ 一手菸、二手菸，還是三手菸？';
function cropHTML([i,x,y,w,h]){return `<span class="crop" style="aspect-ratio:${w*16}/${h*9}"><img src="${IMG[i]}" alt="" style="width:${100*100/w}%;height:${100*100/h}%;left:${-100*x/w}%;top:${-100*y/h}%"></span>`}
function visual(o){return o.crop?cropHTML(o.crop):o.emoji?`<span class="cemoji" aria-hidden="true">${o.emoji}</span>`:''}
let fi=0,fres=[],ftried=false,showZh=false;
const fq=document.getElementById('fq'),fb=document.getElementById('fqBody');
function openFinal(){stopSpeech();fi=0;fres=[];renderF();fq.showModal()}
function fqSay(q){return q.sort?q.t+' Which smoke is it?':(q.say||q.t)}
function renderF(){
  stopSpeech();ftried=false;
  if(fi>=FQ.length)return renderResult();
  const q=FQ[fi];
  const dots=FQ.map((_,i)=>`<i class="${i<fi?(fres[i]?'ok':'miss'):''}${i===fi?' now':''}"></i>`).join('');
  fb.innerHTML=`<div class="fqtop"><span class="part p${q.p+1}" id="fqTitle">Part ${q.p+1} · ${PARTS[q.p]}</span><span class="dots" aria-label="Question ${fi+1} of ${FQ.length}">${dots}</span><button class="btn small" id="fqClose">Close ×</button></div>
   ${q.img!=null?`<img class="fqpic" src="${IMG[q.img]}" alt="">`:''}${q.emoji?`<div class="fqemoji" aria-hidden="true">${q.emoji}</div>`:''}
   <p class="fqq">${q.t}${q.sort?'<br><span style="font-size:.8em;color:#8d3f4d">Which smoke is it?</span>':''}</p>
   <p class="fqzh" lang="zh-Hant" ${showZh?'':'hidden'}>${q.sort?SORT_ZH:q.zh}</p>
   <div class="fqrow"><button class="btn" id="fqListen">🔊 Listen</button><button class="btn small" id="fqZh" aria-pressed="${showZh}">中文</button></div>
   <div class="qc" id="fqC"></div>
   <p class="qf" id="fqF" role="status" aria-live="polite">${q.sort?'Show 1, 2 or 3 fingers. Then tap!':'Choose an answer.'}</p>
   <div class="qb"><span>Question ${fi+1} of ${FQ.length}</span><button class="btn" id="fqNext" hidden>${fi===FQ.length-1?'See my stars ⭐':'Next →'}</button></div>`;
  const box=fb.querySelector('#fqC');
  const SORTIMG=[3,4,5];
  const labels=q.sort?SORT.map((s,i)=>`<span class="crop wide"><img src="${IMG[SORTIMG[i]]}" alt="" style="width:100%;height:100%;left:0;top:0"></span><span class="sortc"><span class="n">${i+1}</span>${s} smoke</span>`):q.c.map(o=>visual(o)+`<span class="ct">${o.t}</span>`);
  labels.forEach((label,i)=>{
    const o=document.createElement('div');o.className='opt';
    const b=document.createElement('button');b.className='choice';b.innerHTML=label;
    b.addEventListener('click',()=>{
      if(fb.querySelector('.choice.correct'))return;
      box.querySelectorAll('.choice').forEach(x=>x.classList.remove('retry'));
      if(i===q.a){b.classList.add('correct');fres[fi]=!ftried;fb.querySelector('#fqF').textContent=ftried?'✓ Yes! Good job.':'✓ Correct! ⭐';speak(ftried?'Yes! Good job.':'Correct!');fb.querySelector('#fqNext').hidden=false}
      else{ftried=true;b.classList.add('retry');fb.querySelector('#fqF').textContent='Try again!';speak('Try again!')}
    });
    o.append(b);
    if(!q.sort){const s=document.createElement('button');s.className='say';s.textContent='🔊 Listen';const txt=q.c[i].t;s.setAttribute('aria-label','Listen to answer: '+txt);s.addEventListener('click',()=>speak(txt));o.append(s)}
    else{const s=document.createElement('button');s.className='say';s.textContent='🔊 Listen';s.addEventListener('click',()=>speak((i+1)+'. '+SORT[i]+' smoke'));o.append(s)}
    box.append(o);
  });
  fb.querySelector('#fqClose').onclick=()=>fq.close();
  fb.querySelector('#fqListen').onclick=()=>speak(fqSay(q));
  fb.querySelector('#fqZh').onclick=e=>{showZh=!showZh;e.currentTarget.setAttribute('aria-pressed',showZh);fb.querySelector('.fqzh').hidden=!showZh};
  fb.querySelector('#fqNext').onclick=()=>{fi++;renderF()};
}
function renderResult(){
  const score=fres.filter(Boolean).length;
  const per=PARTS.map((name,p)=>{const idx=FQ.map((q,i)=>q.p===p?i:-1).filter(i=>i>=0);const ok=idx.filter(i=>fres[i]).length;return `<div><strong>Part ${p+1} · ${name}</strong><br>${'⭐'.repeat(ok)}${'☆'.repeat(idx.length-ok)} ${ok} / ${idx.length}</div>`}).join('');
  const msg=score===FQ.length?'Super star!':score>=FQ.length*.7?'Great job!':'Good try!';
  fb.innerHTML=`<div class="fqtop"><span class="part p2" id="fqTitle">Story Quiz</span><span class="dots"></span><button class="btn small" id="fqClose">Close ×</button></div>
   <div class="fqres"><p class="big">${score===FQ.length?'🏆':'🌟'}</p><h2>${msg}</h2><p style="font-size:clamp(22px,2.6vw,30px);margin:0">First-try answers: <strong>${score} / ${FQ.length}</strong></p>
   <div class="parts">${per}</div>
   <p style="font-size:clamp(18px,2.2vw,24px)">Remember: <strong>“Grandpa, please don’t smoke at home.”</strong></p>
   <div class="fqrow" style="justify-content:center"><button class="btn" id="fqAgain">↺ Try again</button><button class="btn rose" id="fqDone">Close</button></div></div>`;
  speak(msg);
  fb.querySelector('#fqClose').onclick=fb.querySelector('#fqDone').onclick=()=>fq.close();
  fb.querySelector('#fqAgain').onclick=()=>{fi=0;fres=[];renderF()};
}
fq.addEventListener('close',stopSpeech);

fit();show(0);
</script>
